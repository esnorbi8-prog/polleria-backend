# =========================================================
# Perfil por defecto: desarrollo local con H2 (archivo persistente)
# Cero configuración: al levantar la app ya queda todo listo.
# Para producción/nube usar el perfil "postgres" (ver application-postgres.properties)
# =========================================================

spring.application.name=polleria-pedidos

# --- Base de datos H2 (persistida en archivo ./data/polleria, no en memoria) ---
spring.datasource.url=jdbc:h2:file:./data/polleria;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# Carga datos de ejemplo (productos) al iniciar
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# Consola web de H2 para inspeccionar la BD: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Swagger / OpenAPI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# --- CORS para el frontend Angular ---
app.cors.allowed-origins=http://localhost:4200

server.port=8080

# --- Mercado Pago (Checkout Pro) ---
# El Access Token NUNCA se pone acá en texto plano: se lee de la variable de
# entorno MERCADOPAGO_ACCESS_TOKEN (en pruebas, tu Access Token "TEST-..." de
# sandbox). Ver la guía de configuración para crear tus credenciales.
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}

# URL pública a la que Mercado Pago llama cuando cambia el estado de un pago
# (webhook). En local (sin ngrok) no llegará tráfico real, pero el endpoint
# de confirmación manual (/api/pedidos/{id}/pago/confirmar) sirve para probar
# el flujo igual. Al desplegar en la nube, apuntar esto a la URL pública real.
mercadopago.notification-url=${MERCADOPAGO_NOTIFICATION_URL:http://localhost:8080/api/pagos/webhook}

# URL del frontend Angular a la que Mercado Pago redirige al cliente
# después de pagar (éxito / error / pendiente).
app.frontend-url=${APP_FRONTEND_URL:http://localhost:4200}
