# =========================================================
# Perfil "postgres": para desplegar en la nube (Render, Railway, Supabase,
# AWS RDS, etc). Se activa con: --spring.profiles.active=postgres
#
# Las credenciales se leen de variables de entorno para no hardcodear
# secretos en el repositorio:
#   DB_URL      p.ej. jdbc:postgresql://host:5432/polleria
#   DB_USERNAME
#   DB_PASSWORD
# =========================================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# En la nube normalmente no queremos re-cargar datos de ejemplo cada vez
spring.sql.init.mode=never

spring.h2.console.enabled=false

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
