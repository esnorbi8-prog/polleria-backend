# =========================================================
# Perfil por defecto: desarrollo local con H2 (archivo persistente)
# Cero configuración: al levantar la app ya queda todo listo.
# Para producción/nube usar el perfil "postgres" (ver application-postgres.properties)
# =========================================================

spring.application.name=polleria-pedidos

# --- Base de datos H2 (persistida en archivo ./data/polleria, no en memoria) ---
spring.datasource.url=jdbc:h2:file:./data/polleria;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# Carga datos de ejemplo (productos) al iniciar
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# Consola web de H2 para inspeccionar la BD: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Swagger / OpenAPI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# --- CORS para el frontend Angular ---
app.cors.allowed-origins=http://localhost:4200

server.port=8080

# --- Mercado Pago (Checkout Pro) ---
# El Access Token NUNCA se pone acá en texto plano: se lee de la variable de
# entorno MERCADOPAGO_ACCESS_TOKEN (en pruebas, tu Access Token "TEST-..." de
# sandbox). Ver la guía de configuración para crear tus credenciales.
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}

# URL pública a la que Mercado Pago llama cuando cambia el estado de un pago
# (webhook). En local (sin ngrok) no llegará tráfico real, pero el endpoint
# de confirmación manual (/api/pedidos/{id}/pago/confirmar) sirve para probar
# el flujo igual. Al desplegar en la nube, apuntar esto a la URL pública real.
mercadopago.notification-url=${MERCADOPAGO_NOTIFICATION_URL:http://localhost:8080/api/pagos/webhook}

# URL del frontend Angular a la que Mercado Pago redirige al cliente
# después de pagar (éxito / error / pendiente).
app.frontend-url=${APP_FRONTEND_URL:http://localhost:4200}

# --- Seguridad: JWT (RF-A01 autenticación por rol) ---
# Clave secreta para firmar los tokens. Trae un valor por defecto para que el
# proyecto arranque sin configurar nada (NO usar ese valor en producción); en
# la nube se debe sobreescribir con la variable de entorno JWT_SECRET (HS256
# necesita al menos 32 caracteres).
app.jwt.secret=${JWT_SECRET:polleria-dev-secret-cambiar-en-produccion-1234567890}
# Duración del token en milisegundos (por defecto 8 horas).
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# --- WhatsApp (bot de notificaciones al cliente) ---
# Proveedor que envía los mensajes: "meta" (API oficial), "twilio" o
# "webqr" (WhatsApp vinculado por QR con el servicio Node whatsapp-service).
# Los tokens NUNCA van acá en texto plano: se leen de variables de entorno.
# Si faltan las credenciales del proveedor elegido, el bot funciona en MODO
# SIMULADO (los mensajes solo se muestran en la consola del backend).
whatsapp.proveedor=${WHATSAPP_PROVEEDOR:meta}

# Meta (WhatsApp Cloud API)
whatsapp.token=${WHATSAPP_TOKEN:}
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
whatsapp.api-version=${WHATSAPP_API_VERSION:v25.0}
# "texto": mensaje libre (el cliente debe haberle escrito al número en las últimas 24 h)
# "plantilla": usa la plantilla aprobada por Meta (funciona siempre)
whatsapp.modo-envio=${WHATSAPP_MODO_ENVIO:texto}
whatsapp.plantilla.nombre=${WHATSAPP_PLANTILLA:aviso_pedido}
whatsapp.plantilla.idioma=es

# Twilio (WhatsApp Sandbox): datos de console.twilio.com
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.whatsapp-from=${TWILIO_WHATSAPP_FROM:+14155238886}
# Opcional: SID (HX...) de una plantilla del Content Template Builder con
# cuerpo "Hola {{1}}, novedades de tu pedido en la Pollería: {{2}}".
# Si se configura, se envía la plantilla en lugar de texto libre.
twilio.content-sid=${TWILIO_CONTENT_SID:}

# WhatsApp vinculado por QR (carpeta whatsapp-service, npm start)
webqr.url=${WHATSAPP_SERVICE_URL:http://localhost:3001}
webqr.api-key=${WHATSAPP_SERVICE_KEY:polleria-dev-key}

# Código de país que se agrega a los celulares de 9 dígitos (Perú = 51)
whatsapp.codigo-pais=51
# Estados que disparan un mensaje (RECIBIDO queda fuera: el cliente aún no pagó)
whatsapp.estados-notificados=PAGADO,EN_PREPARACION,LISTO,EN_CAMINO,ENTREGADO,CANCELADO
# Tiempos que se le informan al cliente
whatsapp.tiempo-preparacion-min=25
whatsapp.tiempo-reparto-min=20
# A cuántos metros del destino se manda "tu motorizado está llegando"
whatsapp.distancia-aviso-llegada-m=150
