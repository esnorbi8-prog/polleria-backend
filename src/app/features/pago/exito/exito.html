<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6 text-center">
      
      <div class="card pollos-card shadow-sm">
        <div class="card-body py-5">
          
          <div *ngIf="estado() === 'cargando'">
            <div class="spinner-border text-primary" style="width: 4rem; height: 4rem;" role="status"></div>
            <h4 class="mt-4 fw-bold text-dark">{{ mensaje() }}</h4>
          </div>

          <div *ngIf="estado() === 'exito'">
            <i class="bi bi-check-circle-fill display-1 text-success drop-shadow mb-3 d-block"></i>
            <h3 class="fw-bold text-dark">{{ mensaje() }}</h3>
            <p class="text-muted">Redirigiéndote a tus pedidos...</p>
            <a routerLink="/cliente/pedidos" class="btn btn-outline-success mt-3 fw-bold">Volver ahora</a>
          </div>

          <div *ngIf="estado() === 'error'">
            <i class="bi bi-x-circle-fill display-1 text-danger drop-shadow mb-3 d-block"></i>
            <h3 class="fw-bold text-dark">Ups... algo salió mal</h3>
            <p class="text-danger fw-semibold">{{ mensaje() }}</p>
            <a routerLink="/cliente/pedidos" class="btn btn-pollos-red mt-3 fw-bold">Regresar a Mis Pedidos</a>
          </div>

        </div>
      </div>

    </div>
  </div>
</div>
