<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      
      <div class="text-center mb-4">
        <img src="/img/logo.png" alt="Logo Los Pollos Hermanos" height="90" class="mb-3 drop-shadow">
        <h2 class="display-6 fw-bold" style="color: #8b0000; text-shadow: 1px 1px 0px #ffcc00;">
          Los Pollos Hermanos
        </h2>
        <p class="text-muted fw-semibold">Sistema de Gestión Interna</p>
      </div>

      <div class="card pollos-card">
        <div class="pollos-card-header text-center">
          <h4 class="mb-0 fw-bold"><i class="bi bi-person-lock"></i> Identificación</h4>
        </div>
        <div class="card-body p-4 p-md-5 bg-white">
          <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
            
            <div *ngIf="errorMessage" class="alert alert-danger fw-semibold shadow-sm">
              {{ errorMessage }}
            </div>

            <!-- Formulario de Verificación de Token -->
            <div *ngIf="mostrarVerificacion" class="p-3 mb-4 rounded" style="background-color: #fff3cd; border: 1px solid #ffe69c;">
              <h5 class="fw-bold text-dark"><i class="bi bi-shield-check text-warning"></i> Verificar Cuenta</h5>
              <p class="small text-muted mb-2">Ingresa el token que obtuviste al finalizar tu registro para activar tu cuenta.</p>
              
              <div *ngIf="mensajeVerificacion" class="alert p-2 small fw-bold" 
                   [ngClass]="exitoVerificacion ? 'alert-success' : 'alert-danger'">
                {{ mensajeVerificacion }}
              </div>

              <div class="input-group mb-2">
                <input type="text" class="form-control" name="token" [(ngModel)]="token" placeholder="Escribe tu token aquí">
                <button type="button" class="btn btn-warning fw-bold" [disabled]="!token || verificando" (click)="verificarToken()">
                  {{ verificando ? 'Verificando...' : 'Verificar' }}
                </button>
              </div>
            </div>

            <div *ngIf="exitoVerificacion && !mostrarVerificacion" class="alert alert-success fw-bold shadow-sm text-center">
              {{ mensajeVerificacion }}
            </div>

            <div class="mb-4">
              <label class="form-label fw-bold text-dark">Correo Electrónico</label>
              <div class="input-group input-group-lg">
                <input type="email" class="form-control bg-light" name="email" 
                       [(ngModel)]="credentials.email" required
                       placeholder="ejemplo@polleria.com">
              </div>
            </div>

            <div class="mb-5">
              <label class="form-label fw-bold text-dark">Contraseña</label>
              <div class="input-group input-group-lg">
                <input type="password" class="form-control bg-light" name="password" 
                       [(ngModel)]="credentials.password" required
                       placeholder="••••••••">
              </div>
            </div>

            <button type="submit" class="btn btn-pollos-red w-100 btn-lg rounded-pill" 
                    [disabled]="!loginForm.valid || loading || verificando">
              {{ loading ? 'Autenticando...' : 'Entrar al Sistema' }}
            </button>
          </form>
          
          <div class="text-center mt-4">
            <small class="text-muted">¿No tienes cuenta? <a routerLink="/registro" class="text-pollos-red fw-bold text-decoration-none">Regístrate aquí</a></small>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
